[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "shift-nth-row-n-steps"
version = "1.0.0"
description = "Shift Nth row N steps in NumPy / PyTorch / TensorFlow / JAX"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "array-api-compat>=1.11.2",
  "cm-time>=0.1.2",
  "rich>=10",
  "typer>=0.15",
  "types-array-api>=1.1.3",
  "typing-extensions>=4.14",
]
urls."Bug Tracker" = "https://github.com/34j/shift-nth-row-n-steps/issues"
urls.Changelog = "https://github.com/34j/shift-nth-row-n-steps/blob/main/CHANGELOG.md"
urls.documentation = "https://shift-nth-row-n-steps.readthedocs.io"
urls.repository = "https://github.com/34j/shift-nth-row-n-steps"
scripts.shift-nth-row-n-steps = "shift_nth_row_n_steps.cli:app"

[dependency-groups]
dev = [
  "aquarel>=0.0.7",
  "array-api-extra>=0.8",
  "coverage",
  "matplotlib>=3.10.3",
  "numpy>=2.2.6",
  "packaging-34j[test]",
  "pandas>=2.3",
  "seaborn>=0.13.2",
  "torch>=2.7.1",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
# These legacy and compatibility APIs intentionally accept unused parameters.
lint.extend-per-file-ignores."src/shift_nth_row_n_steps/_main.py" = [ "ARG001" ]
# The benchmark must continue after backend/device failures and is intentionally nested.
lint.extend-per-file-ignores."src/shift_nth_row_n_steps/cli.py" = [ "BLE001", "PLR1702" ]
# Tests exercise implementation modules directly and invoke a fixed local module.
lint.extend-per-file-ignores."tests/**/*" = [ "PLC2701", "S603" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
